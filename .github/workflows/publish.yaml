name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without leading `v` (e.g. 2.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: bash .github/scripts/validate-release.sh

      - name: Prepare and commit version
        run: bash .github/scripts/prepare-release.sh

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: pnpm exec vsce publish --no-dependencies --skip-duplicate

      - name: Create GitHub release
        run: gh release create "v${VERSION}" --target "$(git rev-parse HEAD)" --generate-notes
